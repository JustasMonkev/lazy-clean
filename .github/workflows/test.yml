name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Exercise statusline wrappers and config paths on every supported platform.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The checker has to survive its own rules, or nobody else should run it.
      - run: npm run slop-check
