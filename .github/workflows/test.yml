name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS is in the matrix because the statusline shell script depends on
    # awk/read behavior that differs between GNU (Linux) and BSD (macOS)
    # tools; a BOM-handling bug shipped green here while failing on every Mac.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The checker has to survive its own rules, or nobody else should run it.
      - run: npm run slop-check
